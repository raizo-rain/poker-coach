<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Poker Coach</title>
<meta name="theme-color" content="#eef2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poker Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column. Top bar, the table (you always sit at the bottom, board in the felt), compact situation controls, then the coach */
:root{
  --bg:#eef2ee; --surface:#ffffff; --sunk:#e4eae5; --ink:#16211b; --muted:#56655c; --line:#cfd8d1;
  --felt:#1d6646; --felt-hi:#2e8c61; --felt-lo:#17583c; --rim:#6e4a2b; --on-felt:#e9f5ee; --accent:#1d6646; --on-accent:#ffffff;
  --raise:#b4561a; --call:#2a68ad; --fold:#8b938e; --good:#2b8a5f; --bad:#c23b33; --warn:#a8740f;
  --cardface:#fffdf7;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1511; --surface:#15211a; --sunk:#1d2c24; --ink:#e6eee8; --muted:#9db0a4; --line:#2a3d32;
  --felt:#1a5a3e; --felt-hi:#257a54; --felt-lo:#134631; --rim:#4f361f; --on-felt:#e9f5ee; --accent:#4fb886; --on-accent:#07130d;
  --raise:#e58a4a; --call:#6aa4e8; --fold:#7d8a83; --good:#4fb886; --bad:#ff6f66; --warn:#e0b04a;
  --cardface:#fbf8ef; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#15211a; --sunk:#1d2c24; --ink:#e6eee8; --muted:#9db0a4; --line:#2a3d32;
  --felt:#1a5a3e; --felt-hi:#257a54; --felt-lo:#134631; --rim:#4f361f; --on-felt:#e9f5ee; --accent:#4fb886; --on-accent:#07130d;
  --raise:#e58a4a; --call:#6aa4e8; --fold:#7d8a83; --good:#4fb886; --bad:#ff6f66; --warn:#e0b04a;
  --cardface:#fbf8ef; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:10px 28px}
.app{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;white-space:nowrap}
h1 span{color:var(--bad)}
.tools{display:flex;align-items:center;gap:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);height:32px}
.stepper button{width:30px;height:30px;border:0;background:transparent;font-size:17px;font-weight:700}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:20px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px}
.stepper .u{font-size:11px;color:var(--muted);padding-right:6px}
.toggle{height:32px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:12px;font-weight:700;color:var(--muted)}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.textbtn{border:0;background:transparent;font-weight:700;font-size:13px;color:var(--accent);padding:6px 4px}

.step{font-size:13px;color:var(--muted);text-align:center;min-height:19px}
.step b{color:var(--ink)}

/* table */
.table{position:relative;width:100%;aspect-ratio:1/0.92;max-width:100%}
.felt{position:absolute;left:9%;right:9%;top:11%;bottom:13%;border-radius:999px;border:6px solid var(--rim);
  background:radial-gradient(ellipse at 50% 38%, var(--felt-hi), var(--felt) 58%, var(--felt-lo));box-shadow:inset 0 2px 14px rgba(0,0,0,.35)}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:78%}
.potlbl{font-family:var(--mono);font-size:11px;color:var(--on-felt);opacity:.85;letter-spacing:.04em}
.board{display:flex;gap:4px;align-items:center}
.board .gap{width:5px}
.hero-hand{position:absolute;left:50%;top:71%;transform:translate(-50%,-50%);display:flex;gap:5px}
.card{width:clamp(34px,10.5vw,46px);aspect-ratio:5/7;border-radius:6px;padding:0;border:1.5px dashed rgba(233,245,238,.55);background:rgba(0,0,0,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;line-height:1;font-size:clamp(14px,4.2vw,18px);color:var(--on-felt)}
.card.big{width:clamp(40px,12.5vw,52px)}
.card .plus{font-size:16px;opacity:.75}
.card.filled{background:var(--cardface);border:1px solid #d9d4c4;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.card.next{border-color:#fff;border-style:solid;animation:pulse 1.6s ease-in-out infinite}
.card .s{font-size:1.05em}
.card[disabled]{opacity:.35;cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,255,255,.25)}}
@media (prefers-reduced-motion:reduce){.card.next{animation:none}.seat{transition:none!important}}
.c0{color:#1a1a1a}.c1{color:#c8312f}.c2{color:#1f5fbf}.c3{color:#1b7a3e}
.seat{position:absolute;transform:translate(-50%,-50%);width:50px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0;
  font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:left .35s ease, top .35s ease}
.seat small{font-size:8px;letter-spacing:.07em;color:var(--muted)}
.seat.me{background:var(--accent);border-color:var(--accent);color:var(--on-accent);width:58px}
.seat.me small{color:var(--on-accent)}
.seat.raiser{border-color:var(--raise);border-width:2px}
.seat.raiser small{color:var(--raise)}
.dealer{position:absolute;width:17px;height:17px;border-radius:50%;background:#f4f1e6;color:#222;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);border:1px solid #b9b4a5;pointer-events:none;transition:left .35s ease, top .35s ease}

/* controls */
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
@media (max-width:380px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 4px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.35}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.wide{grid-column:1/-1}
select,input[type=number]{font:inherit;font-size:14px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:100%;min-width:0;height:32px}
input[type=number]{font-family:var(--mono)}
.seg{display:flex;gap:3px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px;height:32px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.check{display:flex;align-items:center;gap:7px;font-size:13px}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:12px;margin:0}

/* coach */
.coach{display:flex;flex-direction:column;gap:10px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.headline{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px}
.legend div{display:flex;align-items:baseline;gap:5px;font-size:13px}
.legend b{font-family:var(--mono);font-size:16px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;align-self:center}
.k-raise,.k-bet{background:var(--raise)} .k-call,.k-check{background:var(--call)} .k-fold{background:var(--fold)} .k-win{background:var(--good)}
.sizing{padding:6px 10px;border-left:3px solid var(--raise);background:var(--sunk);border-radius:0 7px 7px 0;font-size:13px}
.why{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.why li::marker{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.stat{background:var(--sunk);border-radius:8px;padding:6px 8px}
.stat .v{font-family:var(--mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.stat .t{font-size:11px;color:var(--muted);line-height:1.2}
.meter{position:relative;height:9px;border-radius:999px;background:var(--sunk)}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--good)}
.meter .need{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.meter-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.tex{display:flex;flex-wrap:wrap;gap:4px}
.tex span{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"Show";font-size:12px;color:var(--accent)}
details[open] summary::after{content:"Hide"}
.rlist{display:flex;flex-direction:column;margin-top:6px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rrow .nm{font-weight:700;font-size:13px}
.rrow .ex{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:-3px}
.share{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.pill{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;white-space:nowrap}
.pill.bad{background:color-mix(in srgb, var(--bad) 16%, transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good)}
.pill.mid{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.note{font-size:11px;color:var(--muted);margin:4px 0 0}

/* picker sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);
  padding:10px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px))}
.sheet-in{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-head strong{font-family:var(--display);font-size:17px}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pick .sp{grid-column:1/-1;height:2px}
.pc{height:40px;border-radius:7px;border:1px solid #d9d4c4;background:var(--cardface);font-family:var(--mono);font-weight:700;font-size:15px;padding:0;
  display:flex;align-items:center;justify-content:center;gap:1px}
.pc:disabled{opacity:.2;cursor:default}
.pc.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.sheet-foot{display:flex;justify-content:space-between;gap:8px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px}
.btn.danger{color:var(--bad)}
</style>
<style>
.blindsbtn{height:32px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 9px;font-family:var(--mono);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.blindsbtn .gear{font-family:var(--body);font-size:14px;color:var(--muted)}
.looseflag{font-family:var(--body);font-size:10px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:5px;padding:1px 5px}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.linkbtn svg{width:13px;height:13px}
.eur{position:relative}
.eur input{padding-right:24px}
.eur::after{content:"€";position:absolute;right:9px;bottom:7px;font-size:13px;color:var(--muted);pointer-events:none}
.bbnote{font-family:var(--mono);font-size:10px;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.switchrow{display:flex;align-items:flex-start;gap:10px;font-size:13px}
.switchrow input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
/* range chart */
.chartwrap{overflow-x:auto}
.chart{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1.5px;min-width:300px}
.hc{aspect-ratio:1;border-radius:3px;font-family:var(--mono);font-size:clamp(7px,2.1vw,10px);font-weight:700;display:flex;align-items:center;justify-content:center;
  color:var(--ink);line-height:1;overflow:hidden;letter-spacing:-.03em;padding:0}
.hc.act{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.hc.mine{outline:2.5px solid var(--ink);outline-offset:-1px;z-index:1}
.chart-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sheet.tall{max-height:92vh;overflow-y:auto}
</style>

<div class="app">
  <div class="top">
    <h1>Pocket Poker Coach <span aria-hidden="true">♥</span></h1>
    <div class="tools">
      <div class="stepper"><button id="pMinus" aria-label="−">−</button><output id="pCount">6</output><span class="u" data-t="players"></span><button id="pPlus" aria-label="+">+</button></div>
      <button class="blindsbtn" id="setBtn" aria-haspopup="dialog"><span class="gear" aria-hidden="true">⚙</span><span id="blindsLbl"></span><span class="looseflag" id="looseFlag" data-t="loose" hidden></span></button>
      <button class="textbtn" id="newHand" data-t="newhand"></button>
    </div>
  </div>

  <div class="step" id="step"></div>

  <div class="table" id="table">
    <div class="felt"></div>
    <div class="center"><span class="potlbl" id="potLbl"></span><div class="board" id="board"></div></div>
    <div class="hero-hand" id="heroHand"></div>
    <div id="seats"></div>
  </div>

  <div class="box" id="stackBox">
    <div class="boxhead"><span class="lbl" data-t="stacks"></span><span class="bbnote" id="effLbl"></span></div>
    <div class="mini">
      <div class="f"><label class="lbl" for="heroStack" data-t="stack_you"></label><div class="eur"><input type="number" id="heroStack" min="0" inputmode="decimal"></div><span class="bbnote" id="heroBB"></span></div>
      <div class="f"><label class="lbl" for="villStack" data-t="stack_them"></label><div class="eur"><input type="number" id="villStack" min="0" inputmode="decimal"></div><span class="bbnote" id="villBB"></span></div>
    </div>
    <p class="hint" data-t="stack_hint"></p>
  </div>

  <div class="box" id="preBox">
    <div class="boxhead"><span class="lbl" data-t="before"></span>
      <button class="linkbtn" id="chartBtn"><svg viewBox="0 0 13 13" aria-hidden="true"><g fill="currentColor"><rect x="0" y="0" width="3.5" height="3.5" rx=".6"/><rect x="4.75" y="0" width="3.5" height="3.5" rx=".6"/><rect x="9.5" y="0" width="3.5" height="3.5" rx=".6" opacity=".4"/><rect x="0" y="4.75" width="3.5" height="3.5" rx=".6"/><rect x="4.75" y="4.75" width="3.5" height="3.5" rx=".6" opacity=".4"/><rect x="9.5" y="4.75" width="3.5" height="3.5" rx=".6" opacity=".4"/><rect x="0" y="9.5" width="3.5" height="3.5" rx=".6" opacity=".4"/><rect x="4.75" y="9.5" width="3.5" height="3.5" rx=".6" opacity=".4"/><rect x="9.5" y="9.5" width="3.5" height="3.5" rx=".6" opacity=".4"/></g></svg><span data-t="chart"></span></button></div>
    <div class="chips" id="sitSeg">
      <button class="chip" data-v="folded" data-t="sit_folded"></button><button class="chip" data-v="limpers" data-t="sit_limpers"></button><button class="chip" data-v="raise" data-t="sit_raise"></button><button class="chip" data-v="reraise" data-t="sit_reraise"></button>
    </div>
    <div class="mini" id="sitExtra"></div>
  </div>

  <div class="box" id="postBox">
    <span class="lbl" id="postLbl"></span>
    <div class="mini">
      <div class="f"><span class="lbl" data-t="opps_in"></span>
        <div class="stepper" style="width:max-content"><button id="oMinus" aria-label="−">−</button><output id="oCount">1</output><button id="oPlus" aria-label="+">+</button></div></div>
      <div class="f"><label class="lbl" for="oppRange" data-t="pre_they"></label>
        <select id="oppRange"><option value="raised" data-t="opt_raised"></option><option value="called" data-t="opt_called"></option><option value="limped" data-t="opt_limped"></option><option value="bb" data-t="opt_bb"></option><option value="reraised" data-t="opt_reraised"></option></select></div>
      <div class="f"><label class="lbl" for="pot" data-t="pot_in"></label><div class="eur"><input type="number" id="pot" min="0" inputmode="decimal"></div><span class="bbnote" id="potBB"></span></div>
      <div class="f"><label class="lbl" for="toCall" data-t="bet_in"></label><div class="eur"><input type="number" id="toCall" min="0" inputmode="decimal" data-tp="none"></div><span class="bbnote" id="callBB"></span></div>
      <div class="f"><span class="lbl" data-t="you_act"></span><div class="seg" id="ipSeg"><button data-v="ip" data-t="last"></button><button data-v="oop" data-t="first"></button></div></div>
      <div class="f" id="histField"><span class="lbl" data-t="earlier"></span><div class="seg" id="histSeg"><button data-v="0" data-t="e_checked"></button><button data-v="1" data-t="e_bet1"></button><button data-v="2" data-t="e_betall"></button></div></div>
      <label class="check f wide"><input type="checkbox" id="raised"> <span data-t="raised_my_bet"></span></label>
    </div>
  </div>

  <div class="coach" id="coach" aria-live="polite"></div>

  <p class="note" data-t="note"></p>
</div>

<!-- card picker -->
<div id="pickerLayer" hidden>
  <div class="scrim" data-close="pickerLayer"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-in">
      <div class="grab"></div>
      <div class="sheet-head"><strong id="sheetTitle"></strong><button class="btn" data-close="pickerLayer" data-t="done"></button></div>
      <div class="pick" id="pick"></div>
      <div class="sheet-foot"><button class="btn danger" id="removeCard" data-t="remove"></button><span class="hint" id="sheetHint" style="align-self:center"></span></div>
    </div>
  </div>
</div>

<!-- settings -->
<div id="setLayer" hidden>
  <div class="scrim" data-close="setLayer"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-in">
      <div class="grab"></div>
      <div class="sheet-head"><strong id="setTitle" data-t="settings"></strong><button class="btn" data-close="setLayer" data-t="done"></button></div>
      <div class="f"><span class="lbl" data-t="language"></span>
        <div class="langs" id="langSeg"><button class="chip" data-v="en">English</button><button class="chip" data-v="es">Español</button><button class="chip" data-v="zh">简体中文</button></div></div>
      <div class="set-grid">
        <div class="f"><label class="lbl" for="sbIn" data-t="small_blind"></label><div class="eur"><input type="number" id="sbIn" min="0.01" step="0.05" inputmode="decimal"></div></div>
        <div class="f"><label class="lbl" for="bbIn" data-t="big_blind"></label><div class="eur"><input type="number" id="bbIn" min="0.01" step="0.05" inputmode="decimal"></div></div>
      </div>
      <p class="hint" data-t="blinds_hint"></p>
      <label class="switchrow"><input type="checkbox" id="looseIn"><span><strong data-t="loose_label"></strong><br><span class="hint" data-t="loose_hint"></span></span></label>
    </div>
  </div>
</div>

<!-- range chart -->
<div id="chartLayer" hidden>
  <div class="scrim" data-close="chartLayer"></div>
  <div class="sheet tall" role="dialog" aria-modal="true" aria-labelledby="chartTitle">
    <div class="sheet-in">
      <div class="grab"></div>
      <div class="sheet-head"><strong id="chartTitle"></strong><button class="btn" data-close="chartLayer" data-t="done"></button></div>
      <div class="chart-legend"><span><i class="sw" style="background:var(--raise)"></i><span data-t="legend_raise"></span></span><span><i class="sw" style="background:var(--call)"></i><span data-t="legend_call"></span></span><span><i class="sw" style="background:var(--sunk);border:1px solid var(--line)"></i><span data-t="legend_fold"></span></span></div>
      <div class="chartwrap"><div class="chart" id="chart"></div></div>
      <p class="hint" id="chartHint"></p>
    </div>
  </div>
</div>

// Card = 0..51, rank = c>>2 (0 = deuce .. 12 = ace), suit = c & 3
const RANKS = '23456789TJQKA';
const SUITS = 'shdc';

function straightTop(mask) {
  // returns top rank index of best straight in 13-bit rank mask, or -1
  for (let t = 12; t >= 4; t--) {
    const m = 0x1f << (t - 4);
    if ((mask & m) === m) return t;
  }
  if ((mask & 0x100f) === 0x100f) return 3; // wheel A-2-3-4-5, top = 5
  return -1;
}

// Evaluate best 5-card hand out of 5..7 cards. Higher is better.
// Category: 8 SF, 7 quads, 6 full house, 5 flush, 4 straight, 3 trips, 2 two pair, 1 pair, 0 high card
function evalHand(cards) {
  const cnt = new Array(13).fill(0);
  const suitMask = [0, 0, 0, 0];
  const suitCnt = [0, 0, 0, 0];
  let mask = 0;
  for (const c of cards) {
    const r = c >> 2, s = c & 3;
    cnt[r]++; suitMask[s] |= 1 << r; suitCnt[s]++; mask |= 1 << r;
  }
  const score = (cat, ks) => {
    let v = cat;
    for (let i = 0; i < 5; i++) v = v * 13 + (ks[i] || 0);
    return v;
  };
  let flushSuit = -1;
  for (let s = 0; s < 4; s++) if (suitCnt[s] >= 5) flushSuit = s;
  if (flushSuit >= 0) {
    const sf = straightTop(suitMask[flushSuit]);
    if (sf >= 0) return score(8, [sf]);
  }
  const quads = [], trips = [], pairs = [], singles = [];
  for (let r = 12; r >= 0; r--) {
    if (cnt[r] === 4) quads.push(r);
    else if (cnt[r] === 3) trips.push(r);
    else if (cnt[r] === 2) pairs.push(r);
    else if (cnt[r] === 1) singles.push(r);
  }
  if (quads.length) {
    let k = -1;
    for (let r = 12; r >= 0; r--) if (cnt[r] > 0 && r !== quads[0]) { k = r; break; }
    return score(7, [quads[0], k]);
  }
  if (trips.length && (trips.length > 1 || pairs.length)) {
    const t = trips[0];
    const p = trips.length > 1 ? Math.max(trips[1], pairs[0] ?? -1) : pairs[0];
    return score(6, [t, p]);
  }
  if (flushSuit >= 0) {
    const ks = [];
    for (let r = 12; r >= 0 && ks.length < 5; r--) if (suitMask[flushSuit] & (1 << r)) ks.push(r);
    return score(5, ks);
  }
  const st = straightTop(mask);
  if (st >= 0) return score(4, [st]);
  if (trips.length) {
    const ks = [];
    for (let r = 12; r >= 0 && ks.length < 2; r--) if (cnt[r] > 0 && r !== trips[0]) ks.push(r);
    return score(3, [trips[0], ...ks]);
  }
  if (pairs.length >= 2) {
    let k = -1;
    for (let r = 12; r >= 0; r--) if (cnt[r] > 0 && r !== pairs[0] && r !== pairs[1]) { k = r; break; }
    return score(2, [pairs[0], pairs[1], k]);
  }
  if (pairs.length === 1) {
    const ks = [];
    for (let r = 12; r >= 0 && ks.length < 3; r--) if (cnt[r] > 0 && r !== pairs[0]) ks.push(r);
    return score(1, [pairs[0], ...ks]);
  }
  const ks = [];
  for (let r = 12; r >= 0 && ks.length < 5; r--) if (cnt[r] > 0) ks.push(r);
  return score(0, ks);
}

function stackPreflop(s, ctx) {

  const S = s.stack || 100;
  const posted = isBB ? 1 : isSB ? 0.5 : 0;
  const rIdx = Math.max(0, Math.min(s.raiserIdx ?? 0, s.posIdx - 1));
  const facingShove = (s.situation === 'raise' && (s.raiseSize || 3) >= 0.85 * S) || (s.situation === 'reraise' && S <= 25);

const RANGES = { raised: { w: 18, cutTop: 0 }, called: { w: 35, cutTop: 3 }, limped: { w: 55, cutTop: 8 }, bb: { w: 100, cutTop: 10 }, reraised: { w: 5, cutTop: 0 } };
function preflopWeight(p, key, loose) {
  const R = RANGES[key];
  const W = Math.min(100, R.w * (loose ? 1.4 : 1));
  let w = W >= 100 ? 1 : 1 - smooth(p, W, Math.max(0.8, W * 0.05));
  if (R.cutTop && p <= R.cutTop) w *= loose ? 0.6 : 0.35;
  return w;
}
const AGG = {
  0: { 6: 0.5, 5: 0.5, 4: 0.6, 3: 0.75, 2.5: 0.9, 2: 1, 1.8: 0.8, 1.5: 0.9, 1: 1, 0: 1 },
  1: { 6: 1, 5: 1, 4: 1, 3: 1, 2.5: 0.9, 2: 0.7, 1.8: 0.9, 1.5: 0.8, 1: 0.45, 0: 0.3 },
  2: { 6: 1, 5: 1, 4: 1, 3: 0.75, 2.5: 0.55, 2: 0.35, 1.8: 0.7, 1.5: 0.5, 1: 0.18, 0: 0.15 },
  3: { 6: 1, 5: 1, 4: 0.85, 3: 0.4, 2.5: 0.25, 2: 0.12, 1.8: 0.45, 1.5: 0.3, 1: 0.07, 0: 0.08 }
};
const CALLER = { 6: 1, 5: 1, 4: 1, 3: 1, 2.5: 1, 2: 0.9, 1.8: 1, 1.5: 0.9, 1: 0.5, 0: 0.25 };
function aggressionLevel(s) {
  let a = 0;
  if (s.raised) a = 3;
  else if (s.toCall > 0) a = s.toCall >= 0.66 * s.pot ? 2 : 1;
  a = Math.min(3, a + (s.history || 0) * (a > 0 ? 1 : 0.5));
  return Math.round(a);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const GROUP_ORDER = ['sf', 'quads', 'fh', 'flush', 'straight', 'set', 'twopair', 'overpair', 'toppair', 'midpair', 'draw', 'air'];

/* s = { hole, board, opponents, oppRange, loose, pot (BB), toCall (BB), raised, history, inPosition } */
function postflopAnalysis(s) {
  const dead = new Set([...s.hole, ...s.board]);
  const me = describe(s.hole, s.board);
  const tex = boardTexture(s.board);
  const agg = aggressionLevel(s);
  const combos = [];
  for (let a = 0; a < 52; a++) {
    if (dead.has(a)) continue;
    for (let b = a + 1; b < 52; b++) {
      if (dead.has(b)) continue;
      const cls = handClass(a, b);
      const w0 = preflopWeight(HAND_INFO[cls].pct, s.oppRange, s.loose);
      if (w0 < 0.01) continue;
      const d = describe([a, b], s.board);
      combos.push({ a, b, cls, d, wm: w0 * AGG[agg][d.tier], wo: w0 * CALLER[d.tier] });
    }
  }
  const sumM = combos.reduce((t, c) => t + c.wm, 0);
  const groups = {};
  for (const c of combos) {
    const g = groups[c.d.group] || (groups[c.d.group] = { w: 0, beat: 0, tie: 0, ex: {} });
    g.w += c.wm;
    if (c.d.v > me.v) g.beat += c.wm; else if (c.d.v === me.v) g.tie += c.wm;
    g.ex[c.cls] = (g.ex[c.cls] || 0) + c.wm;
  }
  const range = GROUP_ORDER.filter(k => groups[k] && groups[k].w / sumM >= 0.005).map(k => {
    const g = groups[k];
    return { key: k, name: tr('g_' + k), share: g.w / sumM, beats: g.beat / g.w, ties: g.tie / g.w,
      ex: Object.entries(g.ex).sort((x, y) => y[1] - x[1]).slice(0, 4).map(e => e[0]) };
  });
  const aheadNow = range.reduce((t, g) => t + g.share * (1 - g.beats - g.ties), 0);

  const cumM = [], cumO = []; let tm = 0, to = 0;
  for (const c of combos) { tm += c.wm; to += c.wo; cumM.push(tm); cumO.push(to); }
  const pick = (cum, tot, r) => { const x = r() * tot; let lo = 0, hi = cum.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < x) lo = m + 1; else hi = m; } return combos[lo]; };
  const r = rng(99);
  const opp = Math.max(1, s.opponents);
  const iters = opp === 1 ? 6000 : 3500;
  const need = 5 - s.board.length;
  let win = 0, n = 0;
  const deckBase = []; for (let c = 0; c < 52; c++) if (!dead.has(c)) deckBase.push(c);
  for (let it = 0; it < iters; it++) {
    const used = new Set(), hands = [];
    let ok = true;
    for (let o = 0; o < opp; o++) {
      let got = null;
      for (let t = 0; t < 30 && !got; t++) { const c = o === 0 ? pick(cumM, tm, r) : pick(cumO, to, r); if (!used.has(c.a) && !used.has(c.b)) got = c; }
      if (!got) { ok = false; break; }
      used.add(got.a); used.add(got.b); hands.push([got.a, got.b]);
    }
    if (!ok) continue;
    const runout = [];
    while (runout.length < need) { const c = deckBase[Math.floor(r() * deckBase.length)]; if (!used.has(c)) { used.add(c); runout.push(c); } }
    const full = [...s.board, ...runout];
    const mine = evalHand([...s.hole, ...full]);
    let best = true, ties = 0;
    for (const h of hands) { const v = evalHand([...h, ...full]); if (v > mine) { best = false; break; } if (v === mine) ties++; }
    if (best) win += 1 / (ties + 1);
    n++;
  }
  const equity = n ? win / n : 0;
  const left = 52 - 2 - s.board.length;
  let hitOdds = 0;
  if (me.draws.outs && s.board.length === 3) hitOdds = 1 - ((left - me.draws.outs) * (left - 1 - me.draws.outs)) / (left * (left - 1));
  else if (me.draws.outs && s.board.length === 4) hitOdds = me.draws.outs / left;
  return { me, tex, agg, range, aheadNow, equity, hitOdds, decision: decide(s, me, tex, agg, equity, hitOdds, range) };
}

function drawText(d) {
  const p = [];
  if (d.flush) p.push(tr(d.nutFlush ? 'd_nutflush' : 'd_flush'));
  if (d.oesd) p.push(tr('d_oesd')); else if (d.gut) p.push(tr('d_gut'));
  if (d.over && !p.length) p.push(tr('d_over'));
  return p.join(tr('and'));
}

function decide(s, me, tex, agg, E, hitOdds, range) {
  const street = s.board.length === 3 ? 'flop' : s.board.length === 4 ? 'turn' : 'river';
  const river = street === 'river';
  const multi = s.opponents >= 2;
  const R_ = [];
  let actions, sizing = '', headline = '', need = 0;
  const big = tex.wet || multi;
  const stack = s.stack || 1e9;
  const spr = s.pot > 0 ? stack / s.pot : 99;
  R_.push(tr('p_have', { name: me.name, draw: me.draws.outs ? drawText(me.draws) : '', outs: me.draws.outs, hit: pct(hitOdds), flop: street === 'flop' }));
  R_.push(tr('p_win', { E: pct(E), multi }));
  if (!s.toCall) {
    let bet = smooth(E, multi ? 0.5 : 0.6, 0.05);
    if (spr <= 2 && me.tier >= 2.5) bet = Math.max(bet, 0.85);
    const goodDraw = !river && me.draws.outs >= 8;
    if (goodDraw) bet = Math.max(bet, s.inPosition ? 0.6 : 0.45);
    let bluff = 0;
    if (E < 0.35 && !goodDraw) bluff = (s.loose ? 0.05 : river ? 0.2 : 0.25) * (multi ? 0.4 : 1) * (s.inPosition ? 1.2 : 0.8);
    bet = Math.max(bet, bluff);
    actions = mix([A('bet', bet), A('check', 1 - bet)]);
    const [lo, hi] = E >= 0.75 && big ? [0.66, 0.75] : E >= 0.6 ? (big ? [0.6, 0.75] : [0.33, 0.5]) : goodDraw ? [0.5, 0.66] : [0.33, 0.33];
    sizing = (s.pot * hi >= stack * 0.6 || (spr <= 2 && me.tier >= 2.5)) ? tr('sz_allin', { amt: MONEY(stack) }) : tr('sz_bet', { lo: Math.round(lo * 100), hi: Math.round(hi * 100), amtLo: s.pot ? MONEY(s.pot * lo) : '', amtHi: s.pot ? MONEY(s.pot * hi) : '' });
    headline = actions[0].key === 'bet' ? (E >= 0.55 ? tr('h_value') : goodDraw ? tr('h_semibluff') : tr('h_bluff')) : tr('h_check');
    if (E >= 0.6) R_.push(tr('p_ahead'));
    else if (goodDraw) R_.push(tr('p_semibluff'));
    else if (E >= 0.4) R_.push(tr('p_medium'));
    else R_.push(tr('p_behind'));
    if (big && E >= 0.6) R_.push(tr('p_wet'));
    if (s.loose) R_.push(tr('p_loose'));
    if (!s.inPosition && E >= 0.4 && E < 0.6) R_.push(tr('p_oop'));
  } else {
    const allinCall = s.toCall >= stack * 0.95;
    const callAmt = Math.min(s.toCall, stack);
    const potAfter = s.pot + s.toCall + callAmt;
    need = callAmt / potAfter;
    const needEff = need * (!river && me.draws.outs >= 8 ? 0.8 : 1);
    let raise = allinCall ? 0 : smooth(E, Math.max(0.7, need + 0.3), 0.04);
    if (!allinCall && spr > 8 && me.tier <= 3) raise *= 0.4;
    const call = smooth(E, needEff, 0.035) * (1 - raise);
    const rAmt = Math.round((s.toCall * 3 + s.pot * 0.2) * 2) / 2;
    actions = mix([A(rAmt >= stack * 0.6 ? 'allin' : 'raise', raise), A(allinCall ? 'callallin' : 'call', call), A('fold', 1 - raise - call)]);
    sizing = rAmt >= stack * 0.6 ? tr('sz_allin', { amt: MONEY(stack) }) : tr('sz_raise', { amt: MONEY(rAmt) });
    const k0 = actions[0].key;
    headline = k0 === 'raise' ? tr('h_raisevalue') : k0 === 'allin' ? tr('h_shove') : k0 === 'callallin' ? tr('h_callshove') : k0 === 'call' ? tr('h_call') : tr('h_fold');
    if (allinCall) R_.push(tr('p_allin_call'));
    R_.push(tr('p_odds', { call: MONEY(callAmt), pot: MONEY(potAfter), need: pct(need) }));
    if (E >= need) R_.push(tr('p_odds_ok', { E: pct(E), need: pct(need) }));
    else if (E >= needEff) R_.push(tr('p_implied'));
    else R_.push(tr('p_odds_bad', { E: pct(E), need: pct(need) }));
    if (agg >= 2) R_.push(tr('p_bigbets'));
    if (k0 === 'raise') R_.push(tr('p_raise'));
  }
  if (s.stack && s.pot > 0) {
    const sp = Math.round(spr * 10) / 10;
    if (spr <= 2 && me.tier >= 2.5) R_.push(tr('p_spr_low', { spr: sp }));
    else if (spr > 8 && me.tier >= 2 && me.tier <= 3) R_.push(tr('p_spr_high', { spr: sp }));
  }
  const beating = range.filter(g => g.beats > 0.6).map(g => g.name);
  if (beating.length) R_.push(tr('p_watch', { list: beating.slice(0, 3).join(', ') }));
  if (multi) R_.push(tr('p_multi', { n: s.opponents }));
  return { actions, sizing, headline, reasons: R_, need, street };
}

if (typeof module !== 'undefined') module.exports = { equityVsRange, preflopAdvice, postflopAnalysis, positionsFor, describe, handClass, classCards, HAND_INFO, cardLabel, setLang: l => { LANG = l; }, setMoney: f => { MONEY = f; }, tr };

</script>
<script>
const $ = id => document.getElementById(id);
const st = {
  n: 6, pos: 3, loose: false, sb: 0.10, bb: 0.20, lang: '',
  cards: [null, null, null, null, null, null, null], seated: false, picking: null,
  situation: 'folded', limpers: 1, raiserIdx: 0, raiseE: 0.60,
  opps: 1, oppRange: 'called', ip: true, potE: 1.30, callE: 0, history: 0, raised: false, example: false, heroE: 20, villE: 20
};
// saved table settings and language
(function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem('ppc-table') || 'null'); } catch (e) {}
  if (s) { Object.assign(st, { n: s.n ?? st.n, loose: !!s.loose, sb: s.sb ?? st.sb, bb: s.bb ?? st.bb, lang: s.lang || '', heroE: s.heroE ?? st.heroE, villE: s.villE ?? st.villE }); }
  if (!st.lang) { const nl = (navigator.language || 'en').toLowerCase(); st.lang = nl.startsWith('es') ? 'es' : nl.startsWith('zh') ? 'zh' : 'en'; }
})();
function saveTable() { try { localStorage.setItem('ppc-table', JSON.stringify({ n: st.n, loose: st.loose, sb: st.sb, bb: st.bb, lang: st.lang, heroE: st.heroE, villE: st.villE })); } catch (e) {} }

// ---------- money ----------
const LOCALES = { en: 'en-IE', es: 'es-ES', zh: 'zh-CN' };
function eur(x) {
  const step = st.bb >= 0.1 ? 0.05 : 0.01;
  const v = Math.round(x / step) * step;
  try { return new Intl.NumberFormat(LOCALES[st.lang], { style: 'currency', currency: 'EUR', minimumFractionDigits: v % 1 === 0 && v >= 10 ? 0 : 2 }).format(v); }
  catch (e) { return '€' + v.toFixed(2); }
}
const bbTxt = bb => (Math.round(bb * 10) / 10).toLocaleString(LOCALES[st.lang] || 'en-IE');
function applyLang() {
  LANG = st.lang;
  MONEY = bb => `${eur(bb * st.bb)} (${bbTxt(bb)} BB)`;
  document.documentElement.lang = st.lang === 'zh' ? 'zh-Hans' : st.lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = tr(el.dataset.tp); });
}
const toBB = e => (+e || 0) / st.bb;
const effBB = () => Math.max(0.5, Math.min(+st.heroE || 0, +st.villE || 0) / st.bb);

// Always start on an empty table
st.potE = Math.round(6.5 * st.bb * 100) / 100; st.raiseE = Math.round(3 * st.bb * 100) / 100;
function newHand() {
  st.cards = [null, null, null, null, null, null, null]; st.situation = 'folded'; st.callE = 0; st.history = 0; st.raised = false;
  st.opps = 1; st.potE = Math.round(6.5 * st.bb * 100) / 100; st.raiseE = Math.round(3 * st.bb * 100) / 100; st.example = false; st.seated = false; render();
}

function cardHTML(c) {
  const s = c & 3, r = RANKS[c >> 2];
  return `<span class="c${s}">${r === 'T' ? '10' : r}</span><span class="s c${s}">${SUIT_SYM[s]}</span>`;
}
function nextEmpty() {
  if (st.cards[0] == null) return 0; if (st.cards[1] == null) return 1;
  for (const i of [2, 3, 4]) if (st.cards[i] == null) return i;
  if (st.cards[5] == null) return 5; if (st.cards[6] == null) return 6; return null;
}
function slotEnabled(i) { return i <= 4 || (i === 5 ? [2, 3, 4].every(j => st.cards[j] != null) : st.cards[5] != null); }
function boardCards() {
  const b = [];
  if ([2, 3, 4].every(i => st.cards[i] != null)) { b.push(st.cards[2], st.cards[3], st.cards[4]);
    if (st.cards[5] != null) { b.push(st.cards[5]); if (st.cards[6] != null) b.push(st.cards[6]); } }
  return b;
}

// ---------- table ----------
function seatXY(k, n) { const ang = Math.PI / 2 + (k * 2 * Math.PI) / n; return [50 + 45 * Math.cos(ang), 50 + 45 * Math.sin(ang), ang]; }
function renderTable() {
  const pos = positionsFor(st.n);
  if (st.pos >= st.n) st.pos = st.n - 1;
  $('pCount').textContent = st.n; $('pMinus').disabled = st.n <= 2; $('pPlus').disabled = st.n >= 9;
  $('blindsLbl').textContent = `${eur(st.sb)}/${eur(st.bb)}`;
  $('looseFlag').hidden = !st.loose;
  const btnIdx = pos.findIndex(p => p === 'BTN' || p === 'BTN/SB');
  const pf = tr('pos_full');
  let html = '';
  pos.forEach((p, i) => {
    const k = (i - st.pos + st.n) % st.n;
    const [x, y, ang] = seatXY(k, st.n);
    const me = st.seated && i === st.pos;
    const raiser = st.situation === 'raise' && i === st.raiserIdx && i < st.pos && boardCards().length < 3;
    html += `<button class="seat${me ? ' me' : ''}${raiser ? ' raiser' : ''}" style="left:${x}%;top:${y}%" data-i="${i}" aria-label="${tr('seat')} ${p}${me ? ' (' + tr('you') + ')' : ''}" title="${pf[p] || p}">${p}<small>${me ? tr('you') : raiser ? tr('raised_tag') : ''}</small></button>`;
    if (i === btnIdx) { const dx = 50 + 33 * Math.cos(ang + 0.32), dy = 50 + 31 * Math.sin(ang + 0.32); html += `<span class="dealer" style="left:${dx}%;top:${dy}%">D</span>`; }
  });
  $('seats').innerHTML = html;
  $('seats').querySelectorAll('.seat').forEach(b => b.onclick = () => {
    st.pos = +b.dataset.i; st.seated = true; st.example = false;
    if (st.raiserIdx >= st.pos) st.raiserIdx = 0;
    render();
    if (st.cards[0] == null) setTimeout(() => openPicker(0), 380);
  });
  const nx = st.seated ? nextEmpty() : null;
  const names = tr('slots');
  const slot = i => {
    const c = st.cards[i], en = slotEnabled(i) && st.seated;
    const cls = `card${i < 2 ? ' big' : ''}${c != null ? ' filled' : ''}${i === nx && c == null && en ? ' next' : ''}`;
    return `<button class="${cls}" data-i="${i}" ${en ? '' : 'disabled'} aria-label="${names[i]}${c != null ? ': ' + cardLabel(c) : ''}">${c != null ? cardHTML(c) : '<span class="plus">+</span>'}</button>`;
  };
  $('heroHand').innerHTML = slot(0) + slot(1);
  $('board').innerHTML = slot(2) + slot(3) + slot(4) + '<span class="gap"></span>' + slot(5) + slot(6);
  document.querySelectorAll('#heroHand .card, #board .card').forEach(b => b.onclick = () => openPicker(+b.dataset.i));
  const b = boardCards();
  $('potLbl').textContent = b.length ? `${tr('pot_lbl')} ${eur(st.potE)}` : tr('board_lbl');
  $('heroHand').style.visibility = st.seated ? 'visible' : 'hidden';
  let step;
  if (st.example) step = tr('step_example');
  else if (!st.seated) step = tr('step1');
  else if (st.cards[0] == null || st.cards[1] == null) step = tr('step2');
  else if (b.length < 3) step = tr('step3');
  else if (b.length === 3) step = tr('step_turn');
  else if (b.length === 4) step = tr('step_river');
  else step = tr('step_done');
  $('step').innerHTML = step;
}

// ---------- sheets ----------
function openLayer(id) { $(id).hidden = false; }
function closeLayer(id) { $(id).hidden = true; if (id === 'pickerLayer') { st.picking = null; render(); } }
document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => closeLayer(el.dataset.close)));
document.addEventListener('keydown', e => { if (e.key === 'Escape') ['pickerLayer', 'setLayer', 'chartLayer'].forEach(id => { if (!$(id).hidden) closeLayer(id); }); });

function openPicker(i) { if (!slotEnabled(i)) return; st.picking = i; st.example = false; renderPicker(); openLayer('pickerLayer'); }
function renderPicker() {
  const i = st.picking;
  $('sheetTitle').textContent = tr('slots')[i];
  $('removeCard').hidden = st.cards[i] == null;
  $('sheetHint').textContent = i < 2 ? tr('private_cards') : tr('shared_cards');
  const used = new Set(st.cards.filter((c, j) => c != null && j !== i));
  let h = '';
  [0, 1, 2, 3].forEach((s, si) => {
    if (si) h += '<span class="sp"></span>';
    for (let r = 12; r >= 0; r--) { const c = r * 4 + s; h += `<button class="pc${st.cards[i] === c ? ' cur' : ''}" data-c="${c}" ${used.has(c) ? 'disabled' : ''} aria-label="${cardLabel(c)}">${cardHTML(c)}</button>`; }
    h += '<span></span>';
  });
  $('pick').innerHTML = h;
  $('pick').querySelectorAll('.pc').forEach(b => b.onclick = () => {
    st.cards[i] = +b.dataset.c;
    const follow = { 0: 1, 2: 3, 3: 4 }[i];
    if (follow != null && st.cards[follow] == null) { st.picking = follow; render(); renderPicker(); }
    else closeLayer('pickerLayer');
  });
}
$('removeCard').onclick = () => {
  st.cards[st.picking] = null;
  if (![2, 3, 4].every(j => st.cards[j] != null)) { st.cards[5] = null; st.cards[6] = null; }
  if (st.cards[5] == null) st.cards[6] = null;
  closeLayer('pickerLayer');
};

function renderSettings() {
  $('langSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.lang)));
  if (document.activeElement !== $('sbIn')) $('sbIn').value = st.sb;
  if (document.activeElement !== $('bbIn')) $('bbIn').value = st.bb;
  $('looseIn').checked = st.loose;
}
$('setBtn').onclick = () => { renderSettings(); openLayer('setLayer'); };
$('langSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.lang = b.dataset.v; saveTable(); applyLang(); renderSettings(); render(); };
$('sbIn').oninput = e => { const v = +e.target.value; if (v > 0) { st.sb = v; saveTable(); render(); } };
$('bbIn').oninput = e => { const v = +e.target.value; if (v > 0) { st.bb = v; saveTable(); render(); } };
$('looseIn').onchange = e => { st.loose = e.target.checked; saveTable(); render(); };

// ---------- range chart ----------
function renderChart() {
  const pos = positionsFor(st.n);
  const sitLbl = tr('sit_' + st.situation);
  $('chartTitle').textContent = tr('chart_title', { pos: pos[st.pos], sit: sitLbl });
  const isBB = st.pos === st.n - 1;
  if (st.situation === 'folded' && isBB) { $('chart').innerHTML = ''; $('chartHint').textContent = tr('chart_bbfolded'); return; }
  const mine = st.cards[0] != null && st.cards[1] != null ? handClass(st.cards[0], st.cards[1]) : null;
  const R = 'AKQJT98765432';
  let h = '';
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
    const cls = i === j ? R[i] + R[j] : i < j ? R[i] + R[j] + 's' : R[j] + R[i] + 'o';
    const [c1, c2] = classCards(cls);
    const a = preflopAdvice({ n: st.n, posIdx: st.pos, c1, c2, situation: st.situation, limpers: st.limpers, raiserIdx: st.raiserIdx, raiseSize: toBB(st.raiseE) || 3, loose: st.loose, brief: true, stack: effBB() });
    let r = 0, c = 0;
    a.actions.forEach(x => { if (['raise', '3bet', '4bet', 'allin'].includes(x.key)) r += x.pctR; else if (x.key !== 'fold') c += x.pctR; });
    const bg = `linear-gradient(to right, var(--raise) 0 ${r}%, var(--call) ${r}% ${r + c}%, var(--sunk) ${r + c}% 100%)`;
    h += `<div class="hc${r + c >= 50 ? ' act' : ''}${cls === mine ? ' mine' : ''}" style="background:${bg}" title="${cls}: ${a.actions.map(x => x.label + ' ' + x.pctR + '%').join(', ')}">${cls}</div>`;
  }
  $('chart').innerHTML = h;
  $('chartHint').textContent = tr('chart_hint');
}
$('chartBtn').onclick = () => { renderChart(); openLayer('chartLayer'); };

// ---------- situation ----------
function renderSituation() {
  const pos = positionsFor(st.n);
  if (st.pos === 0 && (st.situation === 'limpers' || st.situation === 'raise')) st.situation = 'folded';
  $('sitSeg').querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v === st.situation));
    b.disabled = st.pos === 0 && (b.dataset.v === 'limpers' || b.dataset.v === 'raise');
  });
  let ex = '';
  if (st.situation === 'limpers') {
    ex = `<div class="f"><span class="lbl">${tr('howmany')}</span><div class="stepper" style="width:max-content"><button id="lMinus" aria-label="−">−</button><output>${st.limpers}</output><button id="lPlus" aria-label="+">+</button></div></div>`;
  } else if (st.situation === 'raise') {
    if (st.raiserIdx >= st.pos) st.raiserIdx = 0;
    ex = `<div class="f"><label class="lbl" for="raiser">${tr('whoraised')}</label><select id="raiser">${pos.slice(0, st.pos).map((p, i) => `<option value="${i}" ${i === st.raiserIdx ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
      <div class="f"><label class="lbl" for="rsize">${tr('raisedto')}</label><div class="eur"><input type="number" id="rsize" min="0" step="${st.sb}" value="${st.raiseE}" inputmode="decimal"></div><span class="bbnote" id="rsizeBB">${bbTxt(toBB(st.raiseE))} BB</span></div>`;
  }
  $('sitExtra').innerHTML = ex; $('sitExtra').hidden = !ex;
  if ($('lMinus')) { $('lMinus').onclick = () => { st.limpers = Math.max(1, st.limpers - 1); render(); }; $('lPlus').disabled = st.limpers >= st.pos; $('lPlus').onclick = () => { st.limpers = Math.min(st.pos, st.limpers + 1); render(); }; }
  if ($('raiser')) {
    $('raiser').onchange = e => { st.raiserIdx = +e.target.value; render(); };
    $('rsize').oninput = e => { st.raiseE = Math.max(0, +e.target.value || 0); $('rsizeBB').textContent = bbTxt(toBB(st.raiseE)) + ' BB'; schedule(); };
  }
  $('preBox').hidden = !st.seated || boardCards().length >= 3;
}

function renderPost() {
  const b = boardCards();
  $('postBox').hidden = b.length < 3;
  $('postLbl').textContent = tr(b.length === 3 ? 'on_flop' : b.length === 4 ? 'on_turn' : 'on_river');
  $('oCount').textContent = st.opps; $('oMinus').disabled = st.opps <= 1; $('oPlus').disabled = st.opps >= st.n - 1;
  $('oppRange').value = st.oppRange;
  $('ipSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String((x.dataset.v === 'ip') === st.ip)));
  $('histSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.v === st.history)));
  $('histField').style.visibility = b.length >= 4 ? 'visible' : 'hidden';
  $('pot').step = $('toCall').step = st.sb;
  if (document.activeElement !== $('pot')) $('pot').value = st.potE;
  if (document.activeElement !== $('toCall')) $('toCall').value = st.callE || '';
  $('potBB').textContent = bbTxt(toBB(st.potE)) + ' BB';
  $('callBB').textContent = st.callE ? bbTxt(toBB(st.callE)) + ' BB' : '';
  $('raised').checked = st.raised;
}

// ---------- coach ----------
const colorKey = k => ['3bet', '4bet', 'allin'].includes(k) ? 'raise' : ['limp', 'complete', 'callallin'].includes(k) ? 'call' : k;
function actionsHTML(a, sizing) {
  const bars = a.map(x => `<span class="k-${colorKey(x.key)}" style="width:${x.pctR}%"></span>`).join('');
  const leg = a.map(x => `<div><span class="dot k-${colorKey(x.key)}"></span><b>${x.pctR}%</b>${x.label}</div>`).join('');
  const agg = a.find(x => ['raise', 'bet', '3bet', '4bet', 'allin'].includes(x.key));
  const lead = agg && a[0] === agg ? tr('size') : agg ? tr(agg.key === 'bet' ? 'if_bet' : 'if_raise') : '';
  return `<div class="bar" role="img" aria-label="${a.map(x => x.label + ' ' + x.pctR + '%').join(', ')}">${bars}</div><div class="legend">${leg}</div>${agg && sizing ? `<div class="sizing"><strong>${lead}:</strong> ${sizing}</div>` : ''}`;
}
const ul = items => `<ul class="why">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
let timer = null;
function schedule() { clearTimeout(timer); timer = setTimeout(runCoach, 30); }

function runCoach() {
  const hand = [st.cards[0], st.cards[1]];
  if (!st.seated || hand.some(c => c == null)) {
    $('coach').innerHTML = `<div class="box"><span class="tag">${tr('coach')}</span><p class="headline">${tr(!st.seated ? 'take_seat' : 'pick_two')}</p><p class="hint">${tr('coach_hint')}</p></div>`;
    return;
  }
  const out = [];
  const board = boardCards();
  if (board.length < 3) {
    const pre = preflopAdvice({ n: st.n, posIdx: st.pos, c1: hand[0], c2: hand[1], situation: st.situation, limpers: st.limpers, raiserIdx: st.raiserIdx, raiseSize: toBB(st.raiseE) || 3, loose: st.loose, stack: effBB() });
    out.push(`<div class="box"><span class="tag">${tr('preflop')} · ${pre.cls} · ${pre.me}</span><p class="headline">${pre.headline}</p>${actionsHTML(pre.actions, pre.sizing)}${ul(pre.reasons)}
      <details><summary>${tr('about', pre.cls)}</summary>${ul(pre.blurb)}</details></div>`);
  } else {
    const a = postflopAnalysis({ hole: hand, board, opponents: st.opps, oppRange: st.oppRange, loose: st.loose, pot: toBB(st.potE), toCall: toBB(st.callE), raised: st.raised, history: board.length > 3 ? st.history : 0, inPosition: st.ip, stack: effBB() });
    const d = a.decision, eq = Math.round(a.equity * 100), need = Math.round(d.need * 100);
    out.push(`<div class="box"><span class="tag">${tr(d.street)} · ${a.me.name}</span><p class="headline">${d.headline}</p>
      <div class="stats">
        <div class="stat"><div class="v">${eq}%</div><div class="t">${tr('chance')}</div></div>
        ${st.callE ? `<div class="stat"><div class="v">${need}%</div><div class="t">${tr('needed')}</div></div>` : ''}
        ${a.me.draws.outs ? `<div class="stat"><div class="v">${a.me.draws.outs}</div><div class="t">${tr('outs_hit', Math.round(a.hitOdds * 100) + '%')}</div></div>` : ''}
      </div>
      ${st.callE ? `<div><div class="meter" role="img" aria-label="${eq}% / ${need}%"><div class="fill" style="width:${eq}%"></div><div class="need" style="left:calc(${need}% - 1px)"></div></div><div class="meter-cap"><span>${tr('your_chance')}</span><span>${tr('line_price')}</span></div></div>` : ''}
      ${actionsHTML(d.actions, d.sizing)}${ul(d.reasons)}
      <div class="tex">${a.tex.notes.map(n => `<span>${n}</span>`).join('')}</div></div>`);
    const rows = a.range.map(g => {
      const status = g.beats > 0.85 ? `<span class="pill bad">${tr('pill_beats')}</span>` : g.beats + g.ties < 0.15 ? `<span class="pill good">${tr('pill_win')}</span>` : g.ties > 0.5 ? `<span class="pill mid">${tr('pill_split')}</span>` : `<span class="pill mid">${tr('pill_mixed')}</span>`;
      return `<div class="rrow"><span class="nm">${g.name}</span><span class="share">${Math.round(g.share * 100)}%</span>${status}<span class="ex">${g.ex.join(' · ')}</span></div>`;
    }).join('');
    out.push(`<div class="box"><details open><summary>${tr('might_have')}</summary>
      <p class="hint" style="margin-top:4px">${tr('might_hint', { bettor: !!(st.callE || st.raised), ahead: Math.round(a.aheadNow * 100) + '%' })}</p>
      <div class="rlist">${rows}</div></details></div>`);
  }
  $('coach').innerHTML = out.join('');
}

function renderStacks() {
  $('stackBox').hidden = !st.seated;
  $('heroStack').step = $('villStack').step = st.sb;
  if (document.activeElement !== $('heroStack')) $('heroStack').value = st.heroE;
  if (document.activeElement !== $('villStack')) $('villStack').value = st.villE;
  $('heroBB').textContent = bbTxt(toBB(st.heroE)) + ' BB';
  $('villBB').textContent = bbTxt(toBB(st.villE)) + ' BB';
  $('effLbl').textContent = tr('eff', bbTxt(effBB()) + ' BB');
}
function render() { renderTable(); renderStacks(); renderSituation(); renderPost(); schedule(); }

// ---------- events ----------
$('pMinus').onclick = () => { st.n = Math.max(2, st.n - 1); if (st.pos >= st.n) st.pos = st.n - 1; st.opps = Math.min(st.opps, st.n - 1); saveTable(); render(); };
$('pPlus').onclick = () => { st.n = Math.min(9, st.n + 1); saveTable(); render(); };
$('newHand').onclick = newHand;
$('sitSeg').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; st.situation = b.dataset.v; render(); };
$('oMinus').onclick = () => { st.opps = Math.max(1, st.opps - 1); render(); };
$('oPlus').onclick = () => { st.opps = Math.min(st.n - 1, st.opps + 1); render(); };
$('oppRange').onchange = e => { st.oppRange = e.target.value; schedule(); };
$('ipSeg').onclick = e => { const b = e.target.closest('button'); if (b) { st.ip = b.dataset.v === 'ip'; render(); } };
$('histSeg').onclick = e => { const b = e.target.closest('button'); if (b) { st.history = +b.dataset.v; render(); } };
$('pot').oninput = e => { st.potE = Math.max(0, +e.target.value || 0); $('potBB').textContent = bbTxt(toBB(st.potE)) + ' BB'; renderTable(); schedule(); };
$('toCall').oninput = e => { st.callE = Math.max(0, +e.target.value || 0); $('callBB').textContent = st.callE ? bbTxt(toBB(st.callE)) + ' BB' : ''; schedule(); };
$('raised').onchange = e => { st.raised = e.target.checked; schedule(); };
$('heroStack').oninput = e => { st.heroE = Math.max(0, +e.target.value || 0); saveTable(); renderStacks(); schedule(); };
$('villStack').oninput = e => { st.villE = Math.max(0, +e.target.value || 0); saveTable(); renderStacks(); schedule(); };
applyLang();
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
